apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: icgroup
  labels:
    app: pgadmin
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
      env: prod
  template:
    metadata:
      labels:
        app: pgadmin
        env: prod
    spec:
      initContainers:
        - name: setup-config
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/lib/pgadmin
              cp /tmp/servers.json /var/lib/pgadmin/servers.json
              cp /tmp/pgpass /var/lib/pgadmin/pgpass
              chmod 600 /var/lib/pgadmin/pgpass
              chmod 644 /var/lib/pgadmin/servers.json
              chown -R 5050:5050 /var/lib/pgadmin
          volumeMounts:
            - name: pgadmin-config
              mountPath: /tmp/servers.json
              subPath: servers.json
            - name: pgadmin-config
              mountPath: /tmp/pgpass
              subPath: pgpass
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:8.4
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: PGADMIN_DEFAULT_PASSWORD
            - name: PGADMIN_SERVER_JSON_FILE
              value: /var/lib/pgadmin/servers.json
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          startupProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 10
      volumes:
        - name: pgadmin-config
          configMap:
            name: pgadmin-servers-config
        - name: pgadmin-data
          emptyDir: {}