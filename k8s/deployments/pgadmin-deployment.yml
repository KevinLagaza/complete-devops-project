apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: icgroup
  labels:
    app: pgadmin
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
      env: prod
  template:
    metadata:
      labels:
        app: pgadmin
        env: prod
    containers:
      - name: pgadmin
        image: dpage/pgadmin4:8.4
        ports:
          - containerPort: 80
        env:
          - name: PGADMIN_DEFAULT_EMAIL
            valueFrom:
              secretKeyRef:
                name: odoo-secrets
                key: PGADMIN_DEFAULT_EMAIL
          - name: PGADMIN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: odoo-secrets
                key: PGADMIN_DEFAULT_PASSWORD
          - name: PGADMIN_LISTEN_PORT
            value: "80"
        volumeMounts:
          - name: pgadmin-servers
            mountPath: /pgadmin4/servers.json
            subPath: servers.json
          - name: pgadmin-servers
            mountPath: /pgadmin4/pgpass
            subPath: pgpass
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
    volumes:
      - name: pgadmin-servers
        configMap:
          name: pgadmin-servers-config
          defaultMode: 0600